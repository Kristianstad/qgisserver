name: Build QGIS Server image

on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore:
      - README.md
      - docker-compose.yml
  pull_request:
    paths-ignore:
      - README.md
      - docker-compose.yml
  workflow_dispatch:
    inputs:
      qgis_version:
        description: QGIS Server version (for example 3.44.15)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, slim, ultra-slim]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read QGIS version
        id: qgis
        env:
          INPUT_VERSION: ${{ inputs.qgis_version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^ARG QGIS_SERVER_VERSION=//p' Dockerfile | head -n 1)"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid QGIS version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'standard' }}
            type=raw,value=${{ steps.qgis.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'standard' }}
            type=raw,value=slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'slim' }}
            type=raw,value=${{ steps.qgis.outputs.version }}-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'slim' }}
            type=raw,value=ultra-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'ultra-slim' }}
            type=raw,value=${{ steps.qgis.outputs.version }}-ultra-slim,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'ultra-slim' }}
            type=sha,enable=${{ matrix.variant == 'standard' }}
            type=sha,suffix=-slim,enable=${{ matrix.variant == 'slim' }}
            type=sha,suffix=-ultra-slim,enable=${{ matrix.variant == 'ultra-slim' }}
            type=ref,event=tag,enable=${{ matrix.variant == 'standard' }}
            type=ref,event=tag,suffix=-slim,enable=${{ matrix.variant == 'slim' }}
            type=ref,event=tag,suffix=-ultra-slim,enable=${{ matrix.variant == 'ultra-slim' }}
          labels: |
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          load: true
          push: false
          tags: qgisserver:test-${{ matrix.variant }}
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
          provenance: false

      - name: Build full image for size comparison
        if: matrix.variant != 'standard'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          load: true
          push: false
          tags: qgisserver:full
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          provenance: false

      - name: Start QGIS Server
        run: |
          chmod -R a+rX tests/smoke
          docker run -d --name smoke -p 18080:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" qgisserver:test-${{ matrix.variant }}
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::QGIS Server exited during startup"
              exit 1
            fi
            if curl -fs -o /dev/null http://127.0.0.1:18080/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::QGIS Server did not answer /ping within 2 minutes"
          exit 1

      - name: Test QGIS Server endpoints
        run: |
          set -e
          docker exec smoke test -f /usr/share/doc/qgisserver/LICENSE
          docker exec smoke env QT_QPA_PLATFORM=offscreen python3 -c "import qgis.core, qgis.server, numpy"
          curl -fsS -o caps.xml "http://127.0.0.1:18080/ows/?MAP=smoke.qgs&SERVICE=WMS&REQUEST=GetCapabilities"
          grep -q '<Name>data</Name>' caps.xml
          curl -fsS -o map.png "http://127.0.0.1:18080/ows/?MAP=smoke.qgs&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=data&STYLES=&SRS=EPSG:3006&BBOX=300000,6100000,900000,6800000&WIDTH=400&HEIGHT=400&FORMAT=image/png"
          file map.png | grep -q 'PNG image data'
          [ "$(stat -c %s map.png)" -gt 2000 ]

      - name: Compare map with base image
        run: |
          set -e
          docker run -d --name ref -p 18081:8080 \
            -v "$PWD/tests/smoke:/qgis-data:ro" \
            3liz/qgis-map-server:${{ steps.qgis.outputs.version }}
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18081/ping && break
            sleep 2
          done
          curl -fsS -o new-map.png "http://127.0.0.1:18080/ows/?MAP=smoke.qgs&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=data&STYLES=&SRS=EPSG:3006&BBOX=300000,6100000,900000,6800000&WIDTH=400&HEIGHT=400&FORMAT=image/png"
          curl -fsS -o ref-map.png "http://127.0.0.1:18081/ows/?MAP=smoke.qgs&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=data&STYLES=&SRS=EPSG:3006&BBOX=300000,6100000,900000,6800000&WIDTH=400&HEIGHT=400&FORMAT=image/png"
          cmp new-map.png ref-map.png

      - name: Verify inherited environment
        if: matrix.variant != 'standard'
        run: |
          base=3liz/qgis-map-server:${{ steps.qgis.outputs.version }}
          docker pull -q "$base"
          env_of() { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1" | sort; }
          missing=$(comm -23 <(env_of "$base") <(env_of qgisserver:test-${{ matrix.variant }}))
          if [ -n "$missing" ]; then
            echo "::error::Missing base image environment values:"
            echo "$missing"
            exit 1
          fi

      - name: Check compressed image size
        if: matrix.variant != 'standard'
        run: |
          size() { docker save "$1" | gzip -6 | wc -c; }
          full=$(size qgisserver:full)
          variant=$(size qgisserver:test-${{ matrix.variant }})
          echo "${{ matrix.variant }}: $((variant / 1048576)) MiB (full: $((full / 1048576)) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ $((variant * 10)) -lt $((full * 9)) ]

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs smoke 2>&1 | tail -n 100 || true
          docker rm -f smoke ref >/dev/null 2>&1 || true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QGIS_SERVER_VERSION=${{ steps.qgis.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          provenance: false
